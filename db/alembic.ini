# Alembic config for qiymet.
#
# NOTE: this file is deliberately ASCII-only. configparser reads it with the
# locale encoding, so a non-ASCII byte here crashes alembic under LANG=C --
# which is the default in slim Docker images. Explanations live in db/README.md.
#
# The connection string is NOT stored here. migrations/env.py reads DATABASE_URL
# so that production credentials never land in git.
#
#   export DATABASE_URL=postgresql+psycopg://qiymet@localhost:5432/qiymet
#   cd db && alembic upgrade head

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# File names stay sortable: 0001_..., 0002_...
file_template = %%(rev)s_%%(slug)s

# Intentionally empty, see env.py
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
